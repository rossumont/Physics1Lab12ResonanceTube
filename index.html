<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resonance Tube Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1A2B; --grid:rgba(160,190,230,.06); --card:#10233a; --card2:#152c47; --line:#24405f;
  --text:#F3EEE2; --muted:#9db0c6; --green:#7FD4A8; --amber:#E8B23A; --bad:#ef6f6f;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);
  font-family:"Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px}
body{background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
.app{display:grid;grid-template-rows:auto 1fr auto;height:100vh;height:100dvh}
header{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;padding:8px 14px;border-bottom:1px solid var(--line)}
header h1{font-size:19px;margin:0;font-weight:700;line-height:1.2}
header .sub{font-size:12.5px;color:var(--muted)}
header .sp{flex:1}
.badge{font-size:12px;padding:3px 8px;border-radius:20px;color:var(--amber);border:1px solid var(--amber);display:none}
button{font-family:inherit;font-size:14px;color:var(--text);background:var(--card2);border:1px solid var(--line);
  border-radius:9px;padding:7px 12px;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button.ghost{background:transparent;border-color:var(--muted)}
button.go{background:#173d30;border-color:var(--green);color:var(--green)}
main.part{display:none;grid-template-columns:minmax(0,1fr) 330px;gap:10px;padding:10px;min-height:0}
main.part.show{display:grid}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.stage{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.view{flex:1;min-height:260px;padding:0;overflow:hidden;position:relative}
.view canvas,.magwrap canvas{display:block;width:100%;height:100%}
.magwrap{height:130px;padding:0;position:relative;overflow:hidden;flex:none}
.maglabel{position:absolute;right:12px;bottom:6px;max-width:40%;text-align:right;font-size:11.5px;line-height:1.3;color:var(--muted);pointer-events:none}
.chips{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;align-items:center}
.chip{font-family:var(--mono);font-size:14px;padding:7px 14px;border-radius:20px;background:var(--card2);border:1.5px solid var(--line);white-space:nowrap}
.chip.on{border-color:var(--green);color:var(--green);background:#12301f}
.chip.step.on,.chip.amber.on{border-color:var(--amber);color:var(--amber);background:#33270c}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lcd{flex:0 1 auto;font-family:var(--mono);font-size:24px;font-weight:600;color:var(--green);background:#06121f;border:1px solid var(--line);
  border-radius:8px;padding:4px 12px;min-width:150px;text-align:right;letter-spacing:1px}
.lcd small{font-size:14px;color:var(--muted);margin-left:4px}
.tag{font-family:var(--mono);font-size:14px;color:var(--muted)}
.tag b{color:var(--text);font-weight:600}
.arrow{font-size:18px;padding:6px 16px;font-family:var(--mono)}
.vol{display:flex;align-items:center;gap:6px;flex:1 1 160px;min-width:0}
.vol input{flex:1;min-width:0;accent-color:var(--green)}
.mono{font-family:var(--mono)}
.side{display:flex;flex-direction:column;gap:8px;overflow:auto;min-height:0;min-width:0}
h2{font-size:14px;margin:0 0 8px;color:var(--amber)}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid var(--line);padding:3px;text-align:center}
th{background:var(--card2);color:var(--muted);font-weight:600;font-family:var(--mono);font-size:12px}
td.p{font-family:var(--mono);color:var(--green);font-weight:600}
td.avg{font-family:var(--mono);color:var(--amber);font-weight:600}
td input,.inp{width:100%;font-family:var(--mono);font-size:13px;color:var(--text);background:#06121f;border:1px solid var(--line);border-radius:6px;padding:5px 2px;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
label.l{font-size:12px;color:var(--muted);display:block;margin:6px 0 2px}
.row{display:flex;gap:6px;margin-top:8px}
.row button{flex:1}
details summary{cursor:pointer;color:var(--amber);font-weight:600;font-size:14px}
details ol{padding-left:20px;margin:6px 0;font-size:13px;line-height:1.5}
.f{font-family:var(--mono);font-size:12.5px;background:#06121f;border-radius:8px;padding:6px 8px;line-height:1.7}
footer{font-size:12px;color:var(--muted);text-align:center;padding:6px 10px 8px;border-top:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* floating water panel (part 1) */
#waterPanel{position:fixed;left:0;top:0;width:150px;background:rgba(16,35,58,.96);border:1px solid var(--green);border-radius:10px;padding:5px 6px 6px;z-index:40;box-shadow:0 8px 24px rgba(0,0,0,.5);visibility:hidden}
.wpHead{display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;color:var(--green);cursor:move;touch-action:none;-webkit-user-select:none;user-select:none;margin-bottom:5px}
.wpHead span:nth-child(2){flex:1;line-height:1.25}
.wpHead .grip{font-size:14px;color:var(--muted)}
.wpHead button{padding:1px 7px;font-size:13px;line-height:1;border-radius:6px}
#waterPanel.mini #wpBody{display:none}
#waterPanel.mini .wpHead{margin-bottom:0}
.waterbtns{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.waterbtns button{padding:6px 2px;font-size:11.5px;border-radius:7px;font-family:var(--mono)}
#slider{width:100%;accent-color:var(--green);margin-top:6px;display:block}
/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.show{display:flex}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;width:min(620px,100%);max-height:92vh;overflow:auto}
.box input[type=number],.box input[type=text],.box input[type=password],.box input[type=email],.box select{font-family:var(--mono);font-size:14px;color:var(--text);background:#06121f;border:1px solid var(--line);border-radius:7px;padding:6px 8px;width:100%}
.box h3{font-size:14px;color:var(--green);margin:14px 0 2px;border-top:1px solid var(--line);padding-top:10px}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.chk{display:flex;gap:8px;align-items:center;font-size:14px;margin:4px 0}
.chk input{width:18px;height:18px;accent-color:var(--green)}
.key{font-family:var(--mono);font-size:13px;line-height:1.6}
.msg{font-size:13px;margin-top:6px}
.linkbox{word-break:break-all;font-family:var(--mono);font-size:11.5px;background:#06121f;border-radius:8px;padding:8px;margin-top:6px;display:none}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#12301f;border:1px solid var(--green);color:var(--green);padding:7px 14px;border-radius:10px;display:none;z-index:60}
@media (max-width:920px), (orientation:portrait){
  .app{height:auto;min-height:100dvh}
  main.part{grid-template-columns:minmax(0,1fr)}
  .card{min-width:0}
  .view{height:54vh;flex:none}
  .side{overflow:visible}
  footer{white-space:normal}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1 data-i18n="title"></h1><div class="sub" id="sub"></div></div>
  <div class="chips" id="partChips"></div>
  <span class="badge" id="lockBadge" data-i18n="locked"></span>
  <div class="sp"></div>
  <button class="ghost mono" id="btnLang">ไทย</button>
  <button class="ghost" id="btnTeacher">🔒 <span data-i18n="teacher"></span></button>
</header>

<!-- ================= PART 1 : closed tube + tuning fork ================= -->
<main class="part" id="part1">
  <section class="stage">
    <div class="card view" id="view1"><canvas id="cv1"></canvas></div>
    <div class="card magwrap" id="magWrap"><canvas id="mag"></canvas><div class="maglabel" data-i18n="magnifier"></div></div>
    <div class="ctrl">
      <button class="go" id="btnStrike">🔔 <span data-i18n="strike"></span></button>
      <button class="chip amber" id="btnCont"></button>
      <span class="tag"><span data-i18n="fork"></span> <b id="fLabel"></b></span>
      <span class="tag">T <b id="tLabel1"></b></span>
      <div class="vol"><span>🔈</span><input type="range" class="volS" min="0" max="1" step="0.01" value="0.6"><span class="mono volP">60%</span></div>
    </div>
  </section>
  <section class="side">
    <div class="card">
      <h2 data-i18n="data"></h2>
      <table>
        <thead><tr><th></th><th data-i18n="trial1"></th><th data-i18n="trial2"></th><th data-i18n="avg"></th></tr></thead>
        <tbody id="tbody1"></tbody>
      </table>
      <div class="g2" style="margin-top:6px">
        <div><label class="l mono">λ (cm)</label><input class="inp" type="number" step="any" id="a1Lam"></div>
        <div><label class="l mono">v (m/s)</label><input class="inp" type="number" step="any" id="a1V"></div>
        <div><label class="l mono">e (cm)</label><input class="inp" type="number" step="any" id="a1E"></div>
        <div><label class="l mono">% diff</label><input class="inp" type="number" step="any" id="a1Err"></div>
      </div>
      <div class="row"><button id="btnCSV1">⬇ CSV</button><button id="btnClear1" data-i18n="clear"></button></div>
    </div>
    <div class="card">
      <details>
        <summary data-i18n="how"></summary>
        <ol id="steps1"></ol>
        <div class="f">L₁ + e = λ/4<br>L₂ + e = 3λ/4<br>λ = 2(L₂ − L₁)<br>v = fλ<br>e = (L₂ − 3L₁)/2<br>v ≈ 331.3·√(1 + T/273.15)</div>
      </details>
    </div>
  </section>
</main>

<!-- ================= PART 2 : open pipes + frequency ================= -->
<main class="part" id="part2">
  <section class="stage">
    <div class="card view" id="view2"><canvas id="cv2"></canvas></div>
    <div class="chips" id="pipeChips"></div>
    <div class="ctrl">
      <button class="go" id="btnSound"></button>
      <button class="arrow" data-dir="-1">◀</button>
      <div class="lcd" id="lcd">0200.0<small>Hz</small></div>
      <button class="arrow" data-dir="1">▶</button>
      <div class="chips" id="stepChips"></div>
      <span class="tag">T <b id="tLabel2"></b></span>
      <div class="vol"><span>🔈</span><input type="range" class="volS" min="0" max="1" step="0.01" value="0.6"><span class="mono volP">60%</span></div>
    </div>
  </section>
  <section class="side">
    <div class="card">
      <h2 data-i18n="data"></h2>
      <table>
        <thead><tr><th></th><th>L (cm)</th><th>f₁ (Hz)</th><th>f₂ (Hz)</th><th>v (m/s)</th></tr></thead>
        <tbody id="tbody2"></tbody>
      </table>
      <div class="row"><button id="btnCSV2">⬇ CSV</button><button id="btnClear2" data-i18n="clear"></button></div>
    </div>
    <div class="card">
      <details>
        <summary data-i18n="how"></summary>
        <ol id="steps2"></ol>
        <div class="f">L<sub>eff</sub> = L + 2e<br>f<sub>n</sub> = n·v / 2L<sub>eff</sub><br>v = 2L<sub>eff</sub>(f₂ − f₁)<br>f₁ vs 1/L → slope ≈ v/2</div>
      </details>
    </div>
  </section>
</main>

<footer id="credit"></footer>
</div>

<!-- floating water-level panel (part 1 only) -->
<div id="waterPanel">
  <div class="wpHead" id="wpHead"><span class="grip">⠿</span><span data-i18n="water"></span><button id="wpMin">–</button></div>
  <div id="wpBody">
    <div class="waterbtns">
      <button data-step="-1">▲▲ 1 cm</button>
      <button data-step="-0.1">▲ 1 mm</button>
      <button data-step="1">▼▼ 1 cm</button>
      <button data-step="0.1">▼ 1 mm</button>
    </div>
    <input type="range" id="slider" min="2" max="95" step="0.05" value="5">
  </div>
</div>

<!-- teacher modal -->
<div class="modal" id="modal"><div class="box">
  <div style="display:flex;justify-content:space-between;align-items:center">
    <h2 style="margin:0" data-i18n="tPanel"></h2><button id="btnClose">✕</button>
  </div>
  <div id="pwStage" style="margin-top:10px">
    <input type="password" id="pw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="row"><button class="go" id="btnLogin" data-i18n="enter"></button></div>
    <div class="msg" id="pwMsg" style="color:var(--bad)"></div>
  </div>
  <div id="tStage" style="display:none">
    <label class="l" data-i18n="tParts"></label>
    <div class="chips" id="sParts"></div>
    <div class="g2">
      <div><label class="l" data-i18n="tTemp"></label><input type="number" id="sTemp" step="0.1"></div>
    </div>

    <h3 data-i18n="p1name"></h3>
    <div class="g2">
      <div><label class="l" data-i18n="tFork"></label>
        <select id="s1Fork">
          <option>256</option><option>288</option><option>320</option><option>341.3</option>
          <option>384</option><option>426.7</option><option>480</option><option selected>512</option>
          <option value="custom" data-i18n="custom"></option>
        </select></div>
      <div><label class="l" data-i18n="tCustom"></label><input type="number" id="s1Custom" step="any" placeholder="440"></div>
      <div><label class="l" data-i18n="tLen"></label><input type="number" id="s1Len" step="1"></div>
      <div><label class="l" data-i18n="tRad"></label><input type="number" id="s1Rad" step="0.05"></div>
    </div>
    <label class="chk"><input type="checkbox" id="s1ShowF"><span data-i18n="tShowF"></span></label>
    <label class="chk"><input type="checkbox" id="s1Meter"><span data-i18n="tMeter"></span></label>
    <label class="chk"><input type="checkbox" id="s1Wave"><span data-i18n="tWave"></span></label>
    <label class="chk"><input type="checkbox" id="s1Noise"><span data-i18n="tNoise"></span></label>

    <h3 data-i18n="p2name"></h3>
    <label class="l" data-i18n="tLens"></label>
    <div class="g5" id="lenInputs"></div>
    <div class="g2"><div><label class="l" data-i18n="tRad"></label><input type="number" id="s2Rad" step="0.1"></div></div>
    <label class="chk"><input type="checkbox" id="s2Meter"><span data-i18n="tMeter"></span></label>
    <label class="chk"><input type="checkbox" id="s2Wave"><span data-i18n="tWave"></span></label>
    <label class="chk"><input type="checkbox" id="s2Noise"><span data-i18n="tNoise"></span></label>

    <div class="row" style="margin-top:12px"><button class="go" id="btnApply" data-i18n="apply"></button><button id="btnLink">🔗 <span data-i18n="link"></span></button></div>
    <div class="linkbox" id="linkBox"></div>
    <div class="msg" id="linkMsg"></div>

    <h3 data-i18n="key"></h3>
    <div class="key" id="keyBox"></div>

    <details style="margin-top:12px">
      <summary data-i18n="chPw"></summary>
      <label class="l">Email</label><input type="email" id="adEmail" autocomplete="off" autocapitalize="off">
      <label class="l" data-i18n="adPw"></label><input type="password" id="adPw" autocomplete="off">
      <label class="l" data-i18n="newPw"></label><input type="text" id="newPw" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="row"><button id="btnChPw" data-i18n="save"></button><button id="btnResetPw" data-i18n="resetPw"></button></div>
      <div class="msg" id="chMsg"></div>
    </details>
  </div>
</div></div>
<div class="toast" id="toast"></div>

function res1(L){

}

}

/* ================= SHA-256 (passwords stored as hashes only) ================= */
function sha256(str){
  const m=new TextEncoder().encode(str), l=m.length, K=[], H=[];
  const isP=x=>{for(let i=2;i*i<=x;i++) if(x%i===0) return false; return true;};
  const frac=x=>((x-Math.floor(x))*4294967296)|0;
  for(let n=2,c=0;c<64;n++){ if(isP(n)){ if(c<8) H[c]=frac(Math.pow(n,1/2)); K[c]=frac(Math.pow(n,1/3)); c++; } }
  const nw=(((l+8)>>6)+1)*16, w=new Array(nw).fill(0);
  for(let i=0;i<l;i++) w[i>>2]|=m[i]<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8); w[nw-1]=l*8;
  const ror=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let j=0;j<nw;j+=16){
    const W=w.slice(j,j+16); let [a,b,c,d,e,f2,g,h]=H;
    for(let i=0;i<64;i++){
      if(i>=16){ const x=W[i-15], y=W[i-2]; W[i]=(W[i-16]+(ror(x,7)^ror(x,18)^(x>>>3))+W[i-7]+(ror(y,17)^ror(y,19)^(y>>>10)))|0; }
      const t1=(h+(ror(e,6)^ror(e,11)^ror(e,25))+((e&f2)^(~e&g))+K[i]+W[i])|0;
      const t2=((ror(a,2)^ror(a,13)^ror(a,22))+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f2; f2=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    [a,b,c,d,e,f2,g,h].forEach((x,k)=>H[k]=(H[k]+x)|0);
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,"0")).join("");
}

      ctx.fillStyle="#3c5878"; ctx.beginPath(); ctx.moveTo(sx-16,yc-th*0.3); ctx.lineTo(sx-2,yc-th*0.62); ctx.lineTo(sx-2,yc+th*0.62); ctx.lineTo(sx-16,yc+th*0.3); ctx.closePath(); ctx.fill();
      ctx.strokeStyle="#9db0c6"; ctx.lineWidth=1; ctx.stroke();
      ctx.strokeStyle="#5b7695"; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(sx-30,yc); ctx.lineTo(sx-50,yc); ctx.lineTo(sx-50,yc+rowH*0.45); ctx.stroke();
      const mx=x1+16;
      ctx.fillStyle="#9db0c6"; ctx.beginPath(); ctx.arc(mx+5,yc,6,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle="#9db0c6"; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(mx+11,yc); ctx.lineTo(mx+34,yc); ctx.stroke();
      if(level>0.02){ for(let j=0;j<3;j++){ const rr=((time*45+j*11)%33)+4, a=Math.min(1,level*(0.25+R))*(1-rr/37);
        ctx.strokeStyle="rgba(127,212,168,"+a+")"; ctx.lineWidth=1.5; ctx.beginPath(); ctx.arc(x1,yc,rr+th/2,-0.6,0.6); ctx.stroke(); } }
      const ry=yc+th/2+5, rh=Math.min(16,rowH*0.22), rl=(lens[i]+2)*ppc;
      ctx.fillStyle="#e9e2c9"; ctx.fillRect(x0,ry,rl,rh);
      ctx.strokeStyle="#222"; ctx.fillStyle="#222"; ctx.font="9px "+MONO; ctx.textAlign="left"; ctx.textBaseline="bottom";
      for(let c=0;c<=lens[i]+2;c++){
        const x=Math.round(x0+c*ppc)+.5; let tl=rh*0.3;
        if(c%10===0){ tl=rh*0.8; if(rh>=12) ctx.fillText(String(c),x+2,ry+rh); } else if(c%5===0) tl=rh*0.5; else if(ppc<4) continue;
        ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(x,ry); ctx.lineTo(x,ry+tl); ctx.stroke();
      }
    }
    ctx.globalAlpha=1;
  }
}

/* ================= main loop ================= */
function frame(now){
  const time=now/1000; let g=0;
  const flick=()=>1+0.06*Math.sin(time*2.1+ph[0])+0.04*Math.sin(time*5.3+ph[1])+0.03*Math.sin(time*12.7+ph[2]);
  if(part===1){
    let env=cont?1:Math.max(0,Math.exp(-(time-strikeAt)/2.6)); if(env<0.004) env=0;
    let R=res1(L); if(S.p1.noise) R*=flick();
    g=Math.min(1,R)*env;
    if(W1>0) draw1(env,R,time); if(MW>0) drawMag();
  }else{
    env2+=((on?1:0)-env2)*0.15;
    let R=res2(cur,f2); if(S.p2.noise) R*=flick();
    g=Math.min(1,R)*env2;
    if(W2>0) draw2(time,R,env2*R);
  }
  if(gain) gain.gain.setTargetAtTime(g*volume*volume,ac.currentTime,0.03);
  requestAnimationFrame(frame);
}

/* ================= floating water panel ================= */
const wp=$("waterPanel"); let wpPlaced=false;
function clampPanel(x,y){ x=Math.max(4,Math.min(innerWidth-wp.offsetWidth-4,x)); y=Math.max(4,Math.min(innerHeight-wp.offsetHeight-4,y)); wp.style.left=x+"px"; wp.style.top=y+"px"; }
function defaultPanelPos(){ const r=$("view1").getBoundingClientRect();
  clampPanel(Math.min(r.right,innerWidth)-wp.offsetWidth-12, Math.max(70,Math.min(innerHeight,r.bottom)-wp.offsetHeight-12));
  wp.style.visibility="visible"; wpPlaced=true; }
(function(){
  let dx=0,dy=0,drag=false; const h=$("wpHead");
  h.addEventListener("pointerdown",e=>{ if(e.target.id==="wpMin") return; drag=true; h.setPointerCapture(e.pointerId);
    const r=wp.getBoundingClientRect(); dx=e.clientX-r.left; dy=e.clientY-r.top; e.preventDefault(); });
  h.addEventListener("pointermove",e=>{ if(drag) clampPanel(e.clientX-dx,e.clientY-dy); });
  ["pointerup","pointercancel"].forEach(ev=>h.addEventListener(ev,()=>drag=false));
  $("wpMin").onclick=()=>{ wp.classList.toggle("mini"); $("wpMin").textContent=wp.classList.contains("mini")?"+":"–"; const r=wp.getBoundingClientRect(); clampPanel(r.left,r.top); };
  addEventListener("resize",()=>{ const r=wp.getBoundingClientRect(); clampPanel(r.left,r.top); });
})();

/* ================= data tables ================= */
const ST1="resoTubeP1_v2", ST2="resoTubeP2_v2";
const ids1=["d1a","d1b","d2a","d2b","d3a","d3b","a1Lam","a1V","a1E","a1Err"];
const ids2=[].concat(...PIPES.map((p,i)=>["L","f1","f2","v"].map(c=>"q"+c+i)));
function load(k){ try{ return JSON.parse(localStorage.getItem(k)||"null"); }catch(e){ return null; } }
function save(k,ids){ try{ const o={}; ids.forEach(i=>o[i]=$(i).value); localStorage.setItem(k,JSON.stringify(o)); }catch(e){} }
function calcAvg(){ for(let n=1;n<=3;n++){ const a=[+$("d"+n+"a").value,+$("d"+n+"b").value].filter((x,j)=>[$("d"+n+"a"),$("d"+n+"b")][j].value!=="" && !isNaN(x));
  $("avg"+n).textContent=a.length?(a.reduce((s,x)=>s+x,0)/a.length).toFixed(2):"–"; } }
function buildTables(){
  $("tbody1").innerHTML=[1,2,3].map(n=>`<tr><td class="p">L<sub>${n}</sub></td><td><input type="number" step="any" id="d${n}a"></td><td><input type="number" step="any" id="d${n}b"></td><td class="avg" id="avg${n}">–</td></tr>`).join("");
  $("tbody2").innerHTML=PIPES.map((p,i)=>`<tr><td class="p">${p}</td>${["L","f1","f2","v"].map(c=>`<td><input type="number" step="any" id="q${c}${i}"></td>`).join("")}</tr>`).join("");
  const d1=load(ST1), d2=load(ST2);
  if(d1) ids1.forEach(i=>{ if(d1[i]!=null) $(i).value=d1[i]; });
  if(d2) ids2.forEach(i=>{ if(d2[i]!=null) $(i).value=d2[i]; });
  ids1.forEach(i=>$(i).addEventListener("input",()=>{ calcAvg(); save(ST1,ids1); }));
  ids2.forEach(i=>$(i).addEventListener("input",()=>save(ST2,ids2)));
  calcAvg();
}
function csv(rows,name){ const s="﻿"+rows.map(r=>r.map(x=>'"'+String(x??"").replace(/"/g,'""')+'"').join(",")).join("\n");
  const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([s],{type:"text/csv"})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); }
$("btnCSV1").onclick=()=>{ const r=[["Resonance Tube Lab - Part 1 (tuning fork)"],["Fork frequency (Hz)",S.p1.showF?S.p1.f:"?"],["Room temperature (C)",S.T],[],["","Trial 1 L (cm)","Trial 2 L (cm)","Average (cm)"]];
  for(let n=1;n<=3;n++) r.push(["L"+n,$("d"+n+"a").value,$("d"+n+"b").value,$("avg"+n).textContent]);
  r.push([],["Wavelength (cm)",$("a1Lam").value],["Speed of sound (m/s)",$("a1V").value],["End correction (cm)",$("a1E").value],["% difference",$("a1Err").value]);
  csv(r,"resonance_part1.csv"); };
$("btnCSV2").onclick=()=>{ const r=[["Resonance Tube Lab - Part 2 (open pipes)"],["Room temperature (C)",S.T],[],["Pipe","L (cm)","f1 (Hz)","f2 (Hz)","v (m/s)"]];
  PIPES.forEach((p,i)=>r.push([p,$("qL"+i).value,$("qf1"+i).value,$("qf2"+i).value,$("qv"+i).value])); csv(r,"resonance_part2.csv"); };

  let f=$("s1Fork").value==="custom"?parseFloat($("s1Custom").value):parseFloat($("s1Fork").value); if(!(f>=100&&f<=2000)) f=S.p1.f;
  const n1=$("s1Noise").checked, n2=$("s2Noise").checked;
  return {T:num("sTemp",-10,50,S.T), parts:formParts,
    p1:{f,len:num("s1Len",40,150,S.p1.len),r:num("s1Rad",0.5,4,S.p1.r),showF:$("s1ShowF").checked,meter:$("s1Meter").checked,wave:$("s1Wave").checked,noise:n1,
        ne:n1?((fresh||!S.p1.noise)?rnd(0.45):S.p1.ne):0},
    p2:{lens:S.p2.lens.map((l,i)=>num("s2L"+i,5,150,l)),r:num("s2Rad",0.3,5,S.p2.r),meter:$("s2Meter").checked,wave:$("s2Wave").checked,noise:n2,
        ne:n2?((fresh||!S.p2.noise)?PIPES.map(()=>rnd(0.3)):S.p2.ne):[0,0,0,0,0]}};
}
